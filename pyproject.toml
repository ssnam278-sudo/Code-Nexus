# Vercel's Python builder (uv) treats this as the project definition and serves
# the WSGI callable named by [tool.vercel].entrypoint.
# https://vercel.com/docs/frameworks/backend/flask
[project]
name = "code-nexus"
version = "0.1.0"
description = "Rainfall-triggered landslide situation room (prototype)"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    # IANA tz database for zoneinfo (IST timestamps in alert messages) on hosts
    # without a system tz db.
    "tzdata>=2024.1",
    # scikit-learn powers POST /api/ml/compare and is imported lazily. It is
    # omitted here so the serverless bundle stays under Vercel's 250 MB limit;
    # that endpoint returns 503 on Vercel. Render installs it via requirements.txt.
]

[tool.uv]
package = false          # deps only -- this repo is an app, not an installable package

[tool.vercel]
entrypoint = "backend.app:app"
