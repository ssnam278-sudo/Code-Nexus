services:
  - type: web
    name: code-nexus
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # one worker so the background rainfall scheduler runs a single loop
    startCommand: gunicorn backend.app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: OPEN_METEO_SYNC_SECONDS
        value: "600"
      - key: CODENEXUS_LIVE_INGEST          # real-time rainfall pull
        value: "1"
      - key: CODENEXUS_LIVE_INGEST_SECONDS
        value: "900"
      # Real alert dispatch (see TELEGRAM_SETUP.md). Set these in the Render
      # dashboard (Environment tab) so the token stays out of the repo.
      # - key: TELEGRAM_BOT_TOKEN
      #   sync: false
      # - key: TELEGRAM_CHAT_ID
      #   sync: false
      # optional: paste a Slack/Discord/other JSON webhook instead of / as well
      # - key: ALERT_WEBHOOK_URL
      #   value: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
